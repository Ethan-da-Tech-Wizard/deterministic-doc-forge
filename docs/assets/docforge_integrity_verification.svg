<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420">
  <defs>
    <style>
      .terminal-bg { fill: #181825; }
      .terminal-header { fill: #11111b; }
      .terminal-title { fill: #a6adc8; font-family: monospace, monospace; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .terminal-text { fill: #cdd6f4; font-family: monospace, monospace; font-size: 13px; }
      .btn-red { fill: #f38ba8; }
      .btn-yellow { fill: #f9e2af; }
      .btn-green { fill: #a6e3a1; }
    </style>
  </defs>
  <rect class="terminal-bg" x="0" y="0" width="860" height="420" rx="10" ry="10" />
  <path class="terminal-header" d="M 0 10 A 10 10 0 0 1 10 0 L 850 0 A 10 10 0 0 1 860 10 L 860 42 L 0 42 Z" />
  <circle class="btn-red" cx="24" cy="21" r="6" />
  <circle class="btn-yellow" cx="42" cy="21" r="6" />
  <circle class="btn-green" cx="60" cy="21" r="6" />
  <text class="terminal-title" x="430" y="26">DocForge: Cryptographic Anti-Tamper Verification</text>
  <g class="terminal-text">
    <text x="24" y="80">$ docforge verify-hash ./dist/WHITEPAPER.md</text>
    <text x="24" y="102">Verifying Document Integrity: ./dist/WHITEPAPER.md</text>
    <text x="24" y="124">Embedded Digest: c9d665c476e36485f44e1ebfdcadcc3933881dde7adbfbbf4f5226781ef88091</text>
    <text x="24" y="146">Computed Digest: c9d665c476e36485f44e1ebfdcadcc3933881dde7adbfbbf4f5226781ef88091</text>
    <text x="24" y="168"></text>
    <text x="24" y="190">Verification PASSED: Document matches cryptographic audit stamp.</text>
    <text x="24" y="212"></text>
    <text x="24" y="234">$ echo &quot;&lt;!-- unauthorized edit --&gt;&quot; &gt;&gt; ./dist/WHITEPAPER.md</text>
    <text x="24" y="256">$ docforge verify-hash ./dist/WHITEPAPER.md</text>
    <text x="24" y="278">Verifying Document Integrity: ./dist/WHITEPAPER.md</text>
    <text x="24" y="300">Embedded Digest: c9d665c476e36485f44e1ebfdcadcc3933881dde7adbfbbf4f5226781ef88091</text>
    <text x="24" y="322">Computed Digest: f820194aef920482019482aef920482019482019482019482aefd2801482a0e2</text>
    <text x="24" y="344"></text>
    <text x="24" y="366">Verification FAILED: Cryptographic hash mismatch!</text>
    <text x="24" y="388">The document was manually edited or corrupted after compilation.</text>
